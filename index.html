<!DOCTYPE html>
<html>
<head>
    <title>Mandarin Statistical Learning Task</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-audio-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        .stim-container { display: flex; justify-content: space-around; align-items: center; width: 800px; margin: 0 auto; }
        .stim-image { width: 300px; height: auto; border: 2px solid #ccc; border-radius: 8px; }
        .fixation { font-size: 60px; font-weight: bold; }
        .jspsych-btn { margin-top: 20px; }
    </style>
</head>
<body></body>
<script>
    /** 1. DATA DEFINITION **/
    const allItems = [
        { name: 'drums', cat: 'music' }, { name: 'guitar', cat: 'music' },
        { name: 'flute', cat: 'music' }, { name: 'piano', cat: 'music' },
        { name: 'dog', cat: 'mammal' }, { name: 'lion', cat: 'mammal' },
        { name: 'cow', cat: 'mammal' }, { name: 'horse', cat: 'mammal' },
        { name: 'hammer', cat: 'carpenter' }, { name: 'nails', cat: 'carpenter' },
        { name: 'saw', cat: 'carpenter' }, { name: 'carpenter_screwdriver', cat: 'carpenter' },
        { name: 'gun', cat: 'weapons' }, { name: 'knife', cat: 'weapons' },
        { name: 'sword', cat: 'weapons' }, { name: 'cannon', cat: 'weapons' },
        { name: 'furniture_chair', cat: 'furniture' }, { name: 'couch', cat: 'furniture' },
        { name: 'table', cat: 'furniture' }, { name: 'bed', cat: 'furniture' },
        { name: 'apple', cat: 'fruit' }, { name: 'orange', cat: 'fruit' },
        { name: 'banana', cat: 'fruit' }, { name: 'grape', cat: 'fruit' },
        { name: 'hand', cat: 'body' }, { name: 'mouth', cat: 'body' },
        { name: 'nose', cat: 'body' }, { name: 'ear', cat: 'body' },
        { name: 'mountain', cat: 'earth' }, { name: 'river', cat: 'earth' },
        { name: 'ocean', cat: 'earth' }, { name: 'volcano', cat: 'earth' }
    ];

    const emotions = ['disgust', 'fear', 'happy', 'sad'];

    /** 2. INITIALIZE JSPSYCH **/
    const jsPsych = initJsPsych({
        on_finish: function() {
            // Uncomment the lines below once you have a DataPipe ID
            /*
            const data = jsPsych.data.get().csv();
            fetch("https://pipe.jspsych.org/api/data/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    experimentID: "YOUR_DATAPIPE_ID",
                    filename: `subject_${Math.floor(Math.random()*10000)}.csv`,
                    data: data
                })
            }).then(() => {
                document.body.innerHTML = '<h3>Study Complete. Data Saved.</h3>';
            });
            */
            jsPsych.data.displayData(); // Currently showing data on screen for debugging
        }
    });

    /** 3. RANDOMIZATION LOGIC **/
    
    // Assign 16 items to Neutral and 4 to each of the 4 Emotions
    function getConditionMapping() {
        let shuffled = jsPsych.randomization.shuffle(allItems.map(i => i.name));
        let mapping = {};
        shuffled.slice(0, 16).forEach(name => mapping[name] = 'neutral');
        let emoGroup = shuffled.slice(16);
        emoGroup.forEach((name, index) => {
            mapping[name] = emotions[Math.floor(index / 4)];
        });
        return mapping;
    }

    const currentMapping = getConditionMapping();

    // Create Trial Variables with Random Foil and Random Side
    function generateTrialVariables() {
        return allItems.map(item => {
            const possibleFoils = allItems.filter(f => f.cat !== item.cat);
            const foil = jsPsych.randomization.sampleWithoutReplacement(possibleFoils, 1)[0];
            const targetIsLeft = Math.random() < 0.5;

            return {
                target_name: item.name,
                target_path: `assets/stims/${item.cat}/${item.name}.png`,
                foil_path: `assets/stims/${foil.cat}/${foil.name}.png`,
                audio_path: `assets/audio/${item.name}.mp3`,
                prime_cat: currentMapping[item.name],
                left_img: targetIsLeft ? `assets/stims/${item.cat}/${item.name}.png` : `assets/stims/${foil.cat}/${foil.name}.png`,
                right_img: targetIsLeft ? `assets/stims/${foil.cat}/${foil.name}.png` : `assets/stims/${item.cat}/${item.name}.png`,
                correct_key: targetIsLeft ? 'f' : 'j'
            };
        });
    }

    /** 4. ASSET PRELOADING **/
    const all_images = [];
    ['neutral', ...emotions].forEach(e => { for(let i=1; i<=12; i++) all_images.push(`assets/primes/${e}/${e}_${i}.jpg`); });
    allItems.forEach(i => all_images.push(`assets/stims/${i.cat}/${i.name}.png`));
    
    const preload = {
        type: jsPsychPreload,
        images: all_images,
        audio: allItems.map(i => `assets/audio/${i.name}.mp3`)
    };

    /** 5. TRIAL BLOCKS **/
    const fixation = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div class="fixation">+</div>',
        choices: "NO_KEYS",
        trial_duration: 500
    };

    const prime_trial = {
        type: jsPsychImageKeyboardResponse,
        stimulus: function() {
            const cat = jsPsych.timelineVariable('prime_cat');
            const randIdx = Math.floor(Math.random() * 12) + 1;
            return `assets/primes/${cat}/${cat}_${randIdx}.jpg`;
        },
        choices: "NO_KEYS",
        trial_duration: 500
    };

    const test_trial = {
        type: jsPsychAudioKeyboardResponse,
        stimulus: jsPsych.timelineVariable('audio_path'),
        choices: ['f', 'j'],
        prompt: function() {
            return `
                <div class="stim-container">
                    <img src="${jsPsych.timelineVariable('left_img')}" class="stim-image">
                    <img src="${jsPsych.timelineVariable('right_img')}" class="stim-image">
                </div>
                <p>Press <strong>F</strong> for Left | Press <strong>J</strong> for Right</p>`;
        },
        trial_duration: 4000,
        response_ends_trial: true,
        data: {
            target: jsPsych.timelineVariable('target_name'),
            condition: jsPsych.timelineVariable('prime_cat'),
            correct_response: jsPsych.timelineVariable('correct_key')
        },
        on_finish: function(data) {
            data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
        }
    };

    /** 6. TIMELINE ASSEMBLY **/
    const main_procedure = {
        timeline: [fixation, prime_trial, test_trial],
        timeline_variables: generateTrialVariables(),
        randomize_order: true,
        repetitions: 4 // Tracks statistical learning over 4 blocks
    };

    jsPsych.run([preload, main_procedure]);
</script>
</html>
